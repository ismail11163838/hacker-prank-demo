
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Alert</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#00ff55;font-family:monospace;overflow:hidden}
#screen{
 height:100dvh;width:100%;padding:12px;position:relative;
 background:radial-gradient(#09200e,#000 75%);
 animation:pulse .35s infinite;
}
@keyframes pulse{50%{filter:brightness(1.5)}}
.top{
 color:red;border:2px solid red;padding:10px;
 font-size:17px;font-weight:bold;text-align:center;
 animation:blink .2s infinite;
}
@keyframes blink{50%{opacity:.15}}
#timer{text-align:center;color:white;font-size:23px;margin:12px}
#messages{
 width:51%;height:65%;overflow:hidden;
 font-size:11px;line-height:1.7;
 text-shadow:0 0 7px #00ff55;
}
#streams{
 position:absolute;right:5px;top:105px;width:46%;
 height:68%;display:flex;gap:4px;overflow:hidden;
}
.lane{
 flex:1;white-space:pre-wrap;overflow:hidden;
 color:#00ff65;font-size:10px;
 text-shadow:0 0 7px #00ff55;
 animation:fall .65s linear infinite;
}
.lane:nth-child(2){animation-duration:.45s}
.lane:nth-child(3){animation-duration:.55s}
.lane:nth-child(4){animation-duration:.38s}
.lane:nth-child(5){animation-duration:.5s}
@keyframes fall{
 from{transform:translateY(-80%)}
 to{transform:translateY(80%)}
}
.bar{
 position:absolute;bottom:25px;left:12px;
 width:calc(100% - 24px);height:9px;
 border:1px solid #00ff55;
}
#progress{height:100%;width:0;background:#00ff55}
#exit{
 position:absolute;right:8px;top:8px;
 color:white;background:#500;border:1px solid red;
 padding:5px;font-size:11px;z-index:3;
}
#reveal{
 display:none;position:absolute;inset:0;z-index:5;
 background:#000;align-items:center;
 justify-content:center;flex-direction:column;
 text-align:center;color:white;
}
#reveal h1{font-size:50px;color:red}
#reveal p{font-size:23px}
</style>
</head>
<body>
<div id="screen">
 <div class="top">⚠ CRITICAL SYSTEM WARNING ⚠</div>
 <div id="timer">SYSTEM SCAN: 60</div>
 <div id="messages"></div>

 <div id="streams">
  <div class="lane"></div><div class="lane"></div>
  <div class="lane"></div><div class="lane"></div>
  <div class="lane"></div>
 </div>

 <button id="exit" onclick="stopDemo()">EXIT ×</button>
 <div class="bar"><div id="progress"></div></div>

 <div id="reveal">
  <h1>মজা! 😂</h1>
  <p>JUST A PRANK</p>
  <p>কোনো তথ্য নেওয়া হয়নি ❤️</p>
 </div>
</div>

<script>
let seconds=60;
let audioCtx=null;
let beepTimer=null;
let mainTimer=null;
let textTimer=null;
let active=true;

const messages=[
"INITIALIZING SECURITY SCAN...",
"GENERATING FAKE DATA PACKETS...",
"SIMULATED NETWORK SCANNING...",
"ENCRYPTION PROCESS STARTED...",
"ROUTING TEST PACKETS...",
"SECURITY PROTOCOL CHECK...",
"WARNING SYSTEM ALERT...",
"RANDOM HEX DATA GENERATED...",
"SIMULATED DATA TRANSFER...",
"ANALYZING DEMO SIGNAL...",
"LOCAL VISUAL SIMULATION...",
"PROCESSING TEST PACKETS..."
];

function hex(){
 return Math.random().toString(16).slice(2,12).toUpperCase();
}

function sound(){
 if(!audioCtx)return;
 const now=audioCtx.currentTime;
 [0,0.19].forEach((delay,i)=>{
  let osc=audioCtx.createOscillator();
  let gain=audioCtx.createGain();
  osc.type="square";
  osc.frequency.setValueAtTime(i?75:105,now+delay);
  gain.gain.setValueAtTime(0.0001,now+delay);
  gain.gain.exponentialRampToValueAtTime(.12,now+delay+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.16);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now+delay);
  osc.stop(now+delay+.18);
 });
}

function startAudio(){
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  sound();
  beepTimer=setInterval(sound,550);
 }catch(e){}
}

function addText(){
 const box=document.getElementById("messages");
 const line=document.createElement("div");
 line.textContent="> "+messages[Math.floor(Math.random()*messages.length)]
 +" ["+hex()+"]";
 box.appendChild(line);
 while(box.children.length>35)box.firstChild.remove();

 document.querySelectorAll(".lane").forEach(l=>{
  l.textContent+=hex()+"\n"+hex()+"\n"+hex()+"\n";
  if(l.textContent.length>500)l.textContent=l.textContent.slice(-250);
 });
}

function finish(){
 if(!active)return;
 active=false;
 clearInterval(mainTimer);
 clearInterval(textTimer);
 clearInterval(beepTimer);
 if(audioCtx){audioCtx.close();audioCtx=null}
 document.getElementById("reveal").style.display="flex";
 document.getElementById("exit").style.display="none";
}

function stopDemo(){
 active=false;
 clearInterval(mainTimer);
 clearInterval(textTimer);
 clearInterval(beepTimer);
 if(audioCtx){audioCtx.close();audioCtx=null}
 document.getElementById("screen").innerHTML=
 "<h2 style='color:white;text-align:center;margin-top:40vh'>ডেমো বন্ধ করা হয়েছে</h2>";
}

function start(){
 startAudio();
 addText();
 textTimer=setInterval(addText,65);
 mainTimer=setInterval(()=>{
  seconds--;
  document.getElementById("timer").textContent="SYSTEM SCAN: "+seconds;
  document.getElementById("progress").style.width=
   ((60-seconds)/60*100)+"%";
  if(seconds<=0)finish();
 },1000);
}

// Page opens: begin visual demo immediately.
start();
</script>
</body>
</html>
