
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Demo</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020403;color:#00ff72;
 font-family:monospace;overflow:hidden;
}
#screen{
 height:100vh;width:100%;
 position:relative;overflow:hidden;
 background:radial-gradient(#092014,#000 75%);
 padding:15px;
 animation:pulse 2s infinite;
}
@keyframes pulse{
 0%,100%{filter:brightness(.85)}
 50%{filter:brightness(1.2)}
}
.top{
 color:red;font-size:18px;font-weight:bold;
 animation:blink .35s infinite;
 border:1px solid red;padding:9px;
}
@keyframes blink{50%{opacity:.2}}
#timer{color:white;text-align:center;font-size:25px;margin:12px}
#messages{
 width:53%;height:65%;overflow:hidden;
 font-size:12px;line-height:1.8;
 text-shadow:0 0 7px #00ff55;
}
.msg{animation:appear .15s}
@keyframes appear{from{opacity:0;transform:translateX(-20px)}to{opacity:1}}
#streams{
 position:absolute;right:5px;top:100px;
 width:44%;height:65%;
 display:flex;gap:5px;overflow:hidden;
}
.lane{
 flex:1;overflow:hidden;
 color:#00ff70;font-size:10px;
 white-space:pre-wrap;
 text-shadow:0 0 5px #00ff55;
 animation:fall linear infinite;
}
.lane:nth-child(1){animation-duration:2s}
.lane:nth-child(2){animation-duration:1.3s}
.lane:nth-child(3){animation-duration:1.7s}
.lane:nth-child(4){animation-duration:1.1s}
.lane:nth-child(5){animation-duration:1.5s}
@keyframes fall{
 from{transform:translateY(-70%)}
 to{transform:translateY(70%)}
}
.bar{
 position:absolute;bottom:55px;left:15px;
 width:calc(100% - 30px);height:9px;
 background:#183022;border:1px solid #00ff72;
}
#progress{height:100%;width:0;background:#00ff62}
#start{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 background:#a00000;color:white;
 border:2px solid red;padding:18px 35px;
 font-size:20px;font-weight:bold;
}
#exit{
 position:absolute;top:8px;right:8px;
 z-index:5;background:#333;color:white;
 border:1px solid white;padding:7px;
}
#reveal{
 display:none;position:absolute;inset:0;
 background:#000;z-index:10;
 align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 color:#fff;
}
#reveal h1{font-size:48px;color:#ff3030}
#reveal p{font-size:23px}
button{cursor:pointer}
.hidden{display:none}
</style>
</head>

<body>
<div id="screen">
 <div class="top">⚠ CRITICAL SYSTEM WARNING ⚠</div>
 <div id="timer">SYSTEM SCAN: 60</div>

 <div id="messages"></div>

 <div id="streams">
  <div class="lane"></div>
  <div class="lane"></div>
  <div class="lane"></div>
  <div class="lane"></div>
  <div class="lane"></div>
 </div>

 <div class="bar"><div id="progress"></div></div>

 <button id="start" onclick="startDemo()">▶ START SYSTEM</button>
 <button id="exit" class="hidden" onclick="stopDemo()">EXIT ×</button>

 <div id="reveal">
  <h1>মজা! 😂</h1>
  <p>JUST A PRANK</p>
  <p>কোনো তথ্য নেওয়া হয়নি ❤️</p>
  <button onclick="location.reload()">আবার দেখুন</button>
 </div>
</div>

<script>
let running=false,seconds=60;
let timer,writer,audioCtx,beepTimer;

const messages=[
 "INITIALIZING SECURITY SCAN...",
 "CONNECTING TO LOCAL DEMO...",
 "GENERATING FAKE DATA PACKETS...",
 "SCANNING SIMULATED NETWORK...",
 "ENCRYPTION PROCESS STARTED...",
 "ROUTING TEST PACKETS...",
 "ACCESS SIMULATION RUNNING...",
 "WARNING: SYSTEM ALERT...",
 "GENERATING RANDOM HEX DATA...",
 "ANALYZING DEMO SIGNAL...",
 "SIMULATED DATA TRANSFER...",
 "CHECKING SECURITY PROTOCOL...",
 "PROCESSING RANDOM PACKETS..."
];

function randomHex(){
 return Array.from({length:8},()=>
 Math.floor(Math.random()*16).toString(16)
 ).join("").toUpperCase();
}

function startDemo(){
 if(running)return;
 running=true;
 seconds=60;

 document.getElementById("start").classList.add("hidden");
 document.getElementById("exit").classList.remove("hidden");

 // Sound starts only after user interaction
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  beepTimer=setInterval(beep,900);
 }catch(e){}

 writer=setInterval(()=>{
  let box=document.getElementById("messages");
  let line=document.createElement("div");
  line.className="msg";
  line.textContent="> "+messages[Math.floor(Math.random()*messages.length)]
    +"  ["+randomHex()+"]";
  box.appendChild(line);
  while(box.children.length>25)box.removeChild(box.firstChild);

  document.querySelectorAll(".lane").forEach(lane=>{
   lane.textContent+=randomHex()+"\n"+randomHex()+"\n";
   if(lane.textContent.length>600)lane.textContent=lane.textContent.slice(-300);
  });
 },100);

 timer=setInterval(()=>{
  seconds--;
  document.getElementById("timer").textContent="SYSTEM SCAN: "+seconds;
  document.getElementById("progress").style.width=
    ((60-seconds)/60*100)+"%";

  if(seconds<=0)finishDemo();
 },1000);
}

function beep(){
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type="sawtooth";
 osc.frequency.value=95;
 gain.gain.value=0.07;
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start();
 osc.stop(audioCtx.currentTime+0.13);
}

function finishDemo(){
 clearInterval(timer);
 clearInterval(writer);
 clearInterval(beepTimer);
 running=false;
 if(audioCtx){audioCtx.close();audioCtx=null}
 document.getElementById("reveal").style.display="flex";
 document.getElementById("exit").classList.add("hidden");
}

function stopDemo(){
 clearInterval(timer);
 clearInterval(writer);
 clearInterval(beepTimer);
 running=false;
 if(audioCtx){audioCtx.close();audioCtx=null}
 location.reload();
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")stopDemo();
});
</script>
</body>
</html>
